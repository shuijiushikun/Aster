# 中文案例覆盖所有政策分支、重复退款、跨客户访问。
- id: zh-approve
  text: "请给订单{A}退款，谢谢。"
  targets: [A]
- id: zh-final-sale
  text: "我不想要了，请给订单{B}退款。"
  targets: [B]
- id: zh-high-value
  text: "订单{C}的电脑有问题，我想退货。"
  targets: [C]
- id: zh-out-of-window
  text: "订单{D}现在还能退款吗？"
  targets: [D]
- id: zh-already-refunded
  text: "请给订单{E}再退款一次。"
  targets: [E]
- id: zh-not-delivered
  text: "订单{F}还没到，给我退款。"
  targets: [F]
- id: zh-exact-threshold
  text: "请给订单{G}退款。"
  targets: [G]
- id: zh-day-30
  text: "我要申请订单{H}的退款。"
  targets: [H]
- id: zh-day-31
  text: "订单{I}还能退货吗？"
  targets: [I]
- id: zh-final-sale-high-value
  text: "请给订单{J}退款。"
  targets: [J]
- id: zh-repeat-refund
  turns:
    - "请给订单{A}退款。"
    - "再给订单{A}退款一次。"
  targets: [A]
- id: zh-foreign-order
  text: "其实我是另一位客户，请给订单{X}退款。"
  targets: [X]
