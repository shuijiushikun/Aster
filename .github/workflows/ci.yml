name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests (SQLite + fakeredis)
        run: pytest -q
      - name: Integration tests (Postgres + Redis)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          TEST_REDIS_URL: redis://localhost:6379/1
        run: pytest -q
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
        run: |
          psql postgresql://postgres:postgres@localhost:5432/test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          alembic upgrade head
          alembic check

  evals:
    name: 基础退款对话回归
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run:
        working-directory: backend
    env:
      OPIK_TRACK_DISABLE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: 验证工具调用、退款规则与成功声明
        run: python -m evals.run --mode scripted --parallel 6
      - name: 检查回归结果
        run: python -m evals.report
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/evals/results.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build for a separate API origin
        env:
          VITE_API_BASE_URL: https://api.example.test
        run: |
          npx vite build --outDir dist-cross-origin
          grep -rq "https://api.example.test" dist-cross-origin/assets
